<div id="frame">
    <div class="inputGroup">
        <span class="inputCaption">Email</span>
        <input type="text" title="Email" [value]="email" (input)="email = $any($event.target).value">
    </div>
    <div class="inputGroup">
        <span class="inputCaption">Password</span>
        <input type="text" title="Password" [value]="password" (input)="password = $any($event.target).value">
    </div>
    <button id="logIn" (click)="logIn()">Log In</button>
</div>
